services:
  mysql_db:
    image: mysql:8.0
    container_name: lab_inventory_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: laboratory_db
      MYSQL_USER: lab_user
      MYSQL_PASSWORD: lab_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  mysql_data:
